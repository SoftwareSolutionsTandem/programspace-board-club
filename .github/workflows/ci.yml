name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:assets
      - run: npm test
      # Три сборки — «Игротека», «Дурак», «Домино» — и проверка состава каждой (docs/ARCHITECTURE.md §8).
      - run: npm run build:all
      - run: npm run check:bundle
  e2e:
    runs-on: ubuntu-latest
    # Полный набор — около 30 минут в одном потоке (программный WebGL); запас на медленный раннер.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e собирает и запускает все три продукта (playwright.config.ts).
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
